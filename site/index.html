<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>유승주 — 프론트엔드 개발자</title>
    <meta
      name="description"
      content="프론트엔드 개발자 유승주의 포트폴리오. AI 세션 여럿을 역할별로 나눠 일하고, 무엇을 할지와 결과 확인은 직접 하는 프론트엔드 개발자"
    />
    <meta property="og:title" content="유승주 — 프론트엔드 개발자" />
    <meta
      property="og:description"
      content="AI 세션 여럿을 역할별로 나눠 일하고, 무엇을 할지와 결과 확인은 직접 하는 프론트엔드 개발자"
    />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Outfit:wght@500;600;700&family=JetBrains+Mono:wght@400&display=swap"
    />
    <script>
      // 첫 페인트 전에 테마를 확정해 깜빡임을 막는다. 저장된 선택이 없으면 시스템 설정을 따른다.
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
